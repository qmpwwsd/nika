# Linux release build for nika: the .deb and the AppImage.
# - Manual dispatch: workflow artifacts only (a test build).
# - Push of a tag vX.Y.Z: the same build, then a DRAFT GitHub release with the files and the tag's CHANGELOG section.
#   The draft is private until the owner reviews and publishes it; this workflow never publishes a release, never
#   creates or moves a tag and never touches the Homebrew tap.
# Least privilege: the build job (which compiles third-party crates) has a read-only token; only draft-release, which
# runs no repository code, gets contents: write. Clean build: no caches.
# Actions are pinned by full commit SHA (the comment names the tag); only official actions/* are used.
name: release-linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push'
        with:
          node-version: 22
      # Before the 10-minute build: the tag must be vX.Y.Z, match every version file and have a CHANGELOG section.
      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" --notes "$RUNNER_TEMP/release-notes.md"
      # Tauri v2 Linux prerequisites (Debian/Ubuntu names), incl. the AppIndicator dev package.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.12.4 --locked
      # --verbose: the bundler prints linuxdeploy's and appimagetool's own output only in verbose mode, and that is
      # where an AppImage failure is explained (0.2.0: "Categories entry not found in desktop file").
      - name: Build the .deb and the AppImage
        working-directory: app/src-tauri
        run: cargo tauri build --verbose --bundles deb,appimage
      - name: Check the .deb
        run: |
          set -euo pipefail
          deb="$(ls app/src-tauri/target/release/bundle/deb/*.deb)"
          dpkg-deb -I "$deb"
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "Depends: $depends"
          for pkg in libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
            grep -qF -- "$pkg" <<<"$depends" || { echo "missing runtime dependency: $pkg" >&2; exit 1; }
          done
          tmux_dep="$(tr ',' '\n' <<<"$depends" | sed 's/^ *//; s/ *$//' | grep -E '^tmux( |$)' || true)"
          [ "$tmux_dep" = "tmux (>= 3.2)" ] || { echo "the .deb must depend on exactly 'tmux (>= 3.2)' (auto-compact needs tmux 3.2 or newer), found: '${tmux_dep:-nothing}'" >&2; exit 1; }
          paths="$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./||')"
          for path in usr/share/applications/io.github.qmpwwsd.nika.desktop usr/lib/nika/nika/bin/nika; do
            grep -qxF -- "$path" <<<"$paths" || { echo "missing from the package: $path" >&2; exit 1; }
          done
          echo "deb ok"
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir dist
          cp app/src-tauri/target/release/bundle/deb/*.deb app/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cd dist
          sha256sum -- *.deb *.AppImage | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nika-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

  # Tag push only (a manual dispatch, even on a tag, stays a test build). Runs no repository code, so no checkout: it
  # downloads the build's files, checks them against SHA256SUMS and creates the draft. If a release for the tag already
  # exists it changes nothing and fails. To retry after a failure, re-run the failed jobs of this run.
  draft-release:
    name: draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nika-linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Check the files
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; nothing was changed" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "nika ${TAG#v}" --notes-file notes/release-notes.md \
            dist/*.deb dist/*.AppImage dist/SHA256SUMS
          echo "draft release for $TAG created: review and publish it on GitHub"
