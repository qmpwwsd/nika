[package]
name = "nika-app"
version = "0.4.0"
description = "nika desktop shell: tray icon, one window, supervises the private nika server"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "nika_app_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# F3: the shell turns the macOS press-and-hold accent popup off for its own process (src/mac.rs). Same version tauri's
# tao/muda already pull in, so Cargo.lock gains only this dependency edge.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSUserDefaults", "NSValue", "NSObject", "NSArray"] }

[features]
# `cargo tauri build` turns this on: the window then loads the embedded error page instead of a dev server
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
